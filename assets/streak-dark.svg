<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="168" viewBox="0 0 880 168" fill="none" role="img" preserveAspectRatio="xMidYMid meet">
  <style>
    .fade { animation: fade .55s cubic-bezier(.22,.61,.36,1) both; }
    .rise { animation: rise .6s cubic-bezier(.22,.61,.36,1) both; }
    .grow { animation: grow .8s cubic-bezier(.22,.61,.36,1) both; }
    .draw { animation: draw 1.4s cubic-bezier(.22,.61,.36,1) both; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    @keyframes grow { from { transform: scaleX(0); } }
    @keyframes draw { from { stroke-dashoffset: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .fade, .rise, .grow, .draw, .sweep { animation: none !important; }
    }
  </style>
  <rect x="0.5" y="0.5" width="879" height="167" rx="6" fill="none" stroke="#30363d"/>
