name: Build profile README

on:
  schedule: # 03:00 JST == 18:00 UTC
    - cron: "0 18 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"
  workflow_dispatch:

concurrency:
  group: profile
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-profile-assets
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Colour is the one thing here that can go wrong silently: a card renders
      # perfectly whatever the hex, and nobody reads a contrast figure twice.
      # Both scripts are dependency-free and run in under a second, before the
      # cards are built rather than after they are pushed.
      #
      #   ramp.mjs --check   six samples still equal tokens.css --c-1..--c-6
      #   contrast.mjs       every ratio quoted in 03-DESIGN-SYSTEM.md,
      #                      recomputed from the hex the code actually ships
      - name: Verify the ramp
        run: node scripts/ramp.mjs --check

      - name: Verify contrast, and that the documents still tell the truth
        run: node scripts/contrast.mjs --fail

      - name: Generate profile cards
        env:
          # 🔴 The default GITHUB_TOKEN is an installation token scoped to THIS
          # repository. It can only enumerate a fraction of the account's repos
          # -- 28 of 312 when this was written -- which silently turns the
          # language and framework cards into a chart of that fraction rather
          # than of the account. That is what put Ruby, a 0.05% language, on the
          # profile at 2%.
          #
          # Fix: create a PAT with read:user (add repo to count private work
          # too) and save it as the PROFILE_TOKEN secret. Without it this still
          # runs, just against whatever slice the default token can see.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          CARD_TITLE: Charlie's Performance
        run: node scripts/generate-cards.mjs

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: regenerate profile assets"
            git push
          fi
