name: Build profile README

on:
  schedule: # 03:00 JST == 18:00 UTC
    - cron: "0 18 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"
  workflow_dispatch:

concurrency:
  group: profile
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-profile-assets
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          CARD_TITLE: Charlie's Performance
          CALENDAR_PALETTE: github
        run: node scripts/generate-cards.mjs

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: regenerate profile assets"
            git push
          fi
